spring.application.name=AeroForge-Intelligence
server.port=${PORT:8080}

# TiDB connection
spring.datasource.url=${DATABASE_URL:jdbc:mysql://127.0.0.1:4000/aeroforge_intelligence?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Flyway database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# File uploads
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ML service
aeroforge.ml-service-url=http://localhost:8000

# Frontend
aeroforge.frontend-url=${FRONTEND_URL:http://localhost:5173}

# JWT configuration
app.jwt.secret=${JWT_SECRET:AeroForgeIntelligenceDevelopmentJwtSecretKey2026Secure}
app.jwt.expiration-ms=86400000
