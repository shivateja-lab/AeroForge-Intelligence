<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AeroForge Intelligence</title><style>
:root{--ink:#15233b;--muted:#64748b;--line:#e7edf4;--blue:#2563eb;--pale:#f5f8fc;--green:#16845b;--amber:#d97706;--red:#dc2626}*{box-sizing:border-box}body{margin:0;font:14px Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);background:#f8fafc}.app{display:grid;grid-template-columns:255px 1fr;min-height:100vh}aside{position:sticky;top:0;height:100vh;background:white;border-right:1px solid var(--line);padding:24px 16px}.brand{display:flex;gap:11px;align-items:center;font-size:18px;font-weight:800;padding:0 10px 25px}.brand i{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#1d4ed8,#60a5fa);color:white;font-style:normal}.brand small{display:block;font-size:9px;letter-spacing:2.4px;color:var(--blue)}.navlabel{font-size:10px;letter-spacing:1.6px;color:#94a3b8;margin:8px 12px}.nav{display:grid;gap:4px}.nav button{border:0;background:none;padding:11px 12px;border-radius:9px;text-align:left;color:#526279;cursor:pointer}.nav button:hover,.nav button.active{background:#eff6ff;color:#1d4ed8;font-weight:700}.identity{position:absolute;bottom:18px;left:18px;right:18px;padding:14px;background:var(--pale);border-radius:12px}.identity b{display:block}.identity small{color:var(--muted)}main{min-width:0}header{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}header h1{font-size:20px;margin:2px 0}header small{color:var(--muted);font-size:10px;letter-spacing:1px}.online{color:var(--green);font-weight:700}.online:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:8px}.content{padding:30px 34px;max-width:1480px;margin:auto}.hero{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px}.hero h2{font-size:28px;margin:0 0 8px}.hero p{margin:0;color:var(--muted);max-width:760px;line-height:1.55}.btn{border:0;border-radius:9px;background:var(--blue);color:white;padding:11px 16px;font-weight:700;cursor:pointer}.btn.secondary{color:var(--blue);background:#eff6ff}.metrics,.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:18px 0}.metric,.panel,.card{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 18px #1e3a5f0a}.metric{padding:20px}.metric b{display:block;font-size:27px}.metric small{color:var(--muted)}.panel{padding:22px;margin:18px 0}.panel h3{margin:0}.sub{color:var(--muted);margin:5px 0 18px}.twocol{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.bars{height:230px;display:flex;align-items:end;gap:17px;border-bottom:1px solid var(--line);padding:20px}.bar{flex:1;background:linear-gradient(#60a5fa,#2563eb);border-radius:6px 6px 0 0;min-height:15px;position:relative}.bar span{position:absolute;bottom:-24px;width:100%;font-size:10px;color:var(--muted);text-align:center}.risk{display:flex;align-items:center;justify-content:center;height:230px}.donut{width:150px;height:150px;border-radius:50%;background:conic-gradient(#16a34a 0 58%,#f59e0b 58% 83%,#dc2626 83%);display:grid;place-items:center}.donut:after{content:"14 models";display:grid;place-items:center;width:88px;height:88px;border-radius:50%;background:#fff;font-weight:800}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}th,td{padding:12px;border-bottom:1px solid var(--line)}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#eef2ff;color:#4338ca;font-size:10px;font-weight:800}.badge.high{background:#fee2e2;color:var(--red)}.badge.low,.badge.accepted{background:#dcfce7;color:#15803d}.badge.medium{background:#fef3c7;color:#a16207}.material-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{overflow:hidden}.card img{width:100%;height:165px;object-fit:cover;background:#eef2f7}.card-body{padding:18px}.card h3{font-size:20px;margin:6px 0}.card p{color:var(--muted);line-height:1.5}.props{display:grid;grid-template-columns:1fr 1fr;gap:8px}.props span{padding:9px;background:var(--pale);border-radius:8px;font-size:11px}.props b{display:block;font-size:13px;margin-top:3px}.alert{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:18px;border:1px solid #fecaca;border-left:4px solid var(--red);background:white;border-radius:12px;margin:12px 0}.alert .icon{font-size:23px}.notice{padding:15px 18px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.form label{font-size:12px;font-weight:700}.form input,.form select{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid #dbe3ec;border-radius:8px;background:white}.source{padding:16px;border-left:4px solid var(--blue);background:#eff6ff;line-height:1.6}.hidden{display:none!important}footer{padding:25px 34px;color:var(--muted);font-size:12px}.mobile{display:none}@media(max-width:900px){.app{display:block}aside{position:static;height:auto}.nav{grid-template-columns:repeat(3,1fr)}.identity{display:none}.metrics,.cards,.material-grid{grid-template-columns:1fr 1fr}.twocol{grid-template-columns:1fr}.content{padding:22px}.hero{display:block}.hero .btn{margin-top:14px}}@media(max-width:560px){.metrics,.cards,.material-grid,.form,.nav{grid-template-columns:1fr}.app aside{padding-bottom:12px}header{padding:0 20px}}
</style></head><body><div class="app"><aside><div class="brand"><i>AF</i><div>AeroForge<small>INTELLIGENCE</small></div></div><div class="navlabel">ENGINEERING WORKSPACE</div><nav class="nav" id="nav"></nav><div class="identity"><b>K SHIVA TEJA</b><small>25EG512B02 · IT-B</small></div></aside><main><header><div><small id="crumb">AEROFORGE / OVERVIEW</small><h1 id="title">Engineering Overview</h1></div><span class="online">Operational dataset loaded</span></header><div class="content" id="view"></div><footer>AeroForge Intelligence · K Shiva Teja · 25EG512B02 · IT-B · Academic engineering decision-support system</footer></main></div><script>
const materials=[
{g:'AA2219-T87',family:'Al-Cu aerospace alloy',img:'https://www.smithsadvanced.com/it/assets/img/products/2219-barra-di-alluminio.jpg',density:'2.84 g/cm³',tensile:'455 MPa',yield:'352 MPa',use:'Cryogenic propellant tanks and welded launch-vehicle structures',src:'Smiths Advanced Metals / published supplier reference'},
{g:'AA2195-T8',family:'Al-Cu-Li alloy',img:'https://scx2.b-cdn.net/gfx/news/hires/nasaspinsman.jpg',density:'2.71 g/cm³',tensile:'572 MPa',yield:'503 MPa',use:'Lightweight cryogenic tank domes and aerospace shell structures',src:'NASA technology article / public reference'},
{g:'Ti-6Al-4V Grade 5',family:'Alpha-beta titanium',img:'https://www.onlinetitanium.com/assets/images/resources/Titanium%206Al-4V%20Grade%205.png',density:'4.43 g/cm³',tensile:'950 MPa',yield:'880 MPa',use:'High-strength aerospace fittings, fasteners and engine structures',src:'Online Titanium / published supplier reference'},
{g:'Inconel 718',family:'Nickel superalloy',img:'https://www.nickel-cobaltalloy.com/photo/ps20724264-uns_n07718_inconel_718_nickel_alloy_vim_esr_smelting_process_readily_fabricated.jpg',density:'8.19 g/cm³',tensile:'1275 MPa',yield:'1034 MPa',use:'Hot-section hardware, turbine components and high-temperature joints',src:'Published alloy supplier reference'},
{g:'AISI 304L',family:'Austenitic stainless steel',img:'https://www.antonmetal.com/uploads/304L-stainless-steel-plate.jpg',density:'8.00 g/cm³',tensile:'485 MPa',yield:'170 MPa',use:'Corrosion-resistant tanks, ducts and welded process equipment',src:'Published stainless supplier reference'},
{g:'AA7075-T6',family:'Al-Zn-Mg-Cu alloy',img:'https://www.aerospace-aluminum.com/upload/image/20250326163858_35243.jpeg',density:'2.81 g/cm³',tensile:'572 MPa',yield:'503 MPa',use:'Aircraft frames and high-strength aerospace structural members',src:'Published aerospace aluminium reference'}];
let batches=JSON.parse(localStorage.getItem('af-batches')||'null')||[{code:'MAT-LV-2219-07',alloy:'AA2219-T87',batch:'HT-2219-24A',thick:'3.2',status:'ACCEPTED'},{code:'MAT-TI-64-12',alloy:'Ti-6Al-4V Grade 5',batch:'HT-TI-1182',thick:'5.0',status:'ACCEPTED'},{code:'MAT-AL-LI-03',alloy:'AA2195-T8',batch:'REF-NASA-2195',thick:'4.1',status:'REFERENCE'}];
let welds=[{id:'WLD-TIG-2407',mat:'MAT-LV-2219-07',a:146,v:13.6,s:4.2,h:'0.378',gas:'Argon 99.999%',op:'K. S. Teja'},{id:'WLD-TIG-2411',mat:'MAT-LV-2219-07',a:171,v:14.1,s:3.6,h:'0.536',gas:'Argon 99.999%',op:'Lab Team B'},{id:'WLD-GTAW-118',mat:'MAT-TI-64-12',a:122,v:12.4,s:3.9,h:'0.310',gas:'Argon 99.999%',op:'Quality Cell'}];
let tests=[{id:'TST-UTM-091',mat:'MAT-LV-2219-07',weld:'WLD-TIG-2407',type:'Tensile coupon',uts:421,ys:318,el:8.9,temp:'23°C'},{id:'TST-CRYO-017',mat:'MAT-LV-2219-07',weld:'WLD-TIG-2411',type:'Cryogenic tensile',uts:446,ys:341,el:7.4,temp:'-196°C'},{id:'TST-TI-044',mat:'MAT-TI-64-12',weld:'WLD-GTAW-118',type:'Weld coupon',uts:912,ys:844,el:10.7,temp:'23°C'}];
const preds=[{id:'P-0108',mat:'MAT-LV-2219-07',w:'WLD-TIG-2407',t:429,y:325,e:8.6,d:'8.2%',risk:'LOW',c:'91%'},{id:'P-0109',mat:'MAT-LV-2219-07',w:'WLD-TIG-2411',t:389,y:287,e:6.1,d:'38.4%',risk:'HIGH',c:'86%'},{id:'P-0110',mat:'MAT-TI-64-12',w:'WLD-GTAW-118',t:918,y:851,e:10.4,d:'11.7%',risk:'LOW',c:'89%'}];
const pages=[['overview','Overview'],['catalogue','Reference catalogue'],['batches','Material batches'],['welds','Weld records'],['tests','Test register'],['prediction','AI prediction'],['alerts','Risk alerts'],['analytics','Analytics'],['sources','Data provenance']];
const nav=document.querySelector('#nav'),view=document.querySelector('#view');pages.forEach(([id,n])=>nav.insertAdjacentHTML('beforeend',`<button data-page="${id}">${n}</button>`));
const badge=x=>`<span class="badge ${String(x).toLowerCase()}">${x}</span>`,table=(h,r)=>`<div class="panel"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`,hero=(t,s,b='')=>`<section class="hero"><div><h2>${t}</h2><p>${s}</p></div>${b}</section>`;
function render(page='overview'){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.querySelector('#title').textContent=pages.find(x=>x[0]===page)[1];document.querySelector('#crumb').textContent='AEROFORGE / '+pages.find(x=>x[0]===page)[1].toUpperCase();
if(page==='overview')view.innerHTML=hero('Engineering overview','A traceable workspace for material batches, TIG/GTAW process records, measured properties and model-assisted risk screening.')+`<div class="metrics"><div class="metric"><b>${batches.length}</b><small>Material batches</small></div><div class="metric"><b>${welds.length}</b><small>Weld records</small></div><div class="metric"><b>${tests.length}</b><small>Measured tests</small></div><div class="metric"><b>2</b><small>Open alerts</small></div></div><div class="twocol"><div class="panel"><h3>Property estimate trend</h3><div class="sub">Predicted tensile strength across recent runs (MPa)</div><div class="bars">${[429,389,918,447,862,411,935].map((v,i)=>`<div class="bar" style="height:${Math.max(25,v/10)}%"><span>P-${108+i}</span></div>`).join('')}</div></div><div class="panel"><h3>Model risk distribution</h3><div class="sub">Saved screening outputs</div><div class="risk"><div class="donut"></div></div></div></div>`+table(['Record','Evidence type','Material','Status'],[['TST-CRYO-017','Measured laboratory test','MAT-LV-2219-07',badge('ACCEPTED')],['P-0109','Model estimate','MAT-LV-2219-07',badge('HIGH')],['WLD-GTAW-118','Weld traveller','MAT-TI-64-12',badge('RECORDED')]]);
if(page==='catalogue')view.innerHTML=hero('Published material reference catalogue','Nominal comparison properties with source labels. These are reference values, not batch certificates or flight allowables.')+`<div class="material-grid">${materials.map(m=>`<article class="card"><img src="${m.img}" alt="${m.g}"><div class="card-body"><small>${m.family}</small><h3>${m.g}</h3><div class="props"><span>Density<b>${m.density}</b></span><span>Tensile<b>${m.tensile}</b></span><span>Yield<b>${m.yield}</b></span><span>Evidence<b>REFERENCE</b></span></div><p><b>Purpose:</b> ${m.use}</p><small>${m.src}</small></div></article>`).join('')}</div>`;
if(page==='batches')view.innerHTML=hero('Material batch registry','Physical inventory records are separated from published reference scenarios.',`<button class="btn" onclick="document.querySelector('#batchForm').classList.toggle('hidden')">+ Register batch</button>`)+`<div id="batchForm" class="panel hidden"><h3>Register physical batch</h3><p class="sub">Use the label and certificate values supplied with the material.</p><form class="form" onsubmit="addBatch(event)"><label>Material code<input name="code" required placeholder="MAT-LV-0001"></label><label>Alloy<select name="alloy">${materials.map(m=>`<option>${m.g}</option>`)}</select></label><label>Batch / heat number<input name="batch" required></label><label>Thickness (mm)<input name="thick" type="number" step=".1" required></label><label>Status<select name="status"><option>RECEIVED</option><option>ACCEPTED</option><option>QUARANTINED</option></select></label><div><br><button class="btn">Save record</button></div></form></div>`+table(['Code','Alloy','Batch / heat','Thickness','Status'],batches.map(x=>[x.code,x.alloy,x.batch,x.thick+' mm',badge(x.status)]));
if(page==='welds')view.innerHTML=hero('Original weld process records','Current, voltage, travel speed, shielding gas and calculated heat input retained with each traveller.')+table(['Weld ID','Material','Current','Voltage','Speed','Heat input','Shielding gas','Operator'],welds.map(x=>[x.id,x.mat,x.a+' A',x.v+' V',x.s+' mm/s',x.h+' kJ/mm',x.gas,x.op]));
if(page==='tests')view.innerHTML=hero('Mechanical test register','Measured laboratory results are shown independently from AI estimates.',`<button class="btn" onclick="document.querySelector('#testForm').classList.toggle('hidden')">+ Add test</button>`)+`<div id="testForm" class="panel hidden"><form class="form" onsubmit="addTest(event)"><label>Test ID<input name="id" required></label><label>Material<select name="mat">${batches.map(b=>`<option>${b.code}</option>`)}</select></label><label>Test type<select name="type"><option>Tensile coupon</option><option>Cryogenic tensile</option><option>Weld coupon</option></select></label><label>Tensile strength (MPa)<input name="uts" type="number" required></label><label>Yield strength (MPa)<input name="ys" type="number" required></label><label>Elongation (%)<input name="el" type="number" step=".1" required></label><div><br><button class="btn">Save measured result</button></div></form></div>`+table(['Test ID','Material','Weld','Type','Tensile','Yield','Elongation','Temperature'],tests.map(x=>[x.id,x.mat,x.weld,x.type,x.uts+' MPa',x.ys+' MPa',x.el+'%',x.temp]));
if(page==='prediction')view.innerHTML=hero('Property and risk estimation','Physics-informed screening using alloy baseline, heat input, HAZ width and successive repairs. Decision support—not flight approval.')+`<div class="twocol"><div class="panel"><h3>Run screening model</h3><form class="form" onsubmit="runModel(event)"><label>Material batch<select>${batches.map(b=>`<option>${b.code} · ${b.alloy}</option>`)}</select></label><label>Weld record<select>${welds.map(w=>`<option>${w.id} · ${w.h} kJ/mm</option>`)}</select></label><label>HAZ width (mm)<input id="haz" type="number" step=".1" value="2.4"></label><label>Successive repairs<input id="rep" type="number" value="0"></label><div><br><button class="btn">Run estimate</button></div></form><div id="result"></div></div><div class="panel"><h3>Model boundary</h3><p>✓ Uses stored process evidence</p><p>✓ Generates repeatable screening output</p><p>✓ Creates engineering review alerts</p><div class="notice">⚠ Does not replace NDT, qualification testing, certificates or authorized sign-off.</div></div></div>`+table(['ID','Material','Weld','Tensile','Yield','Elong.','Defect','Risk','Confidence'],preds.map(x=>[x.id,x.mat,x.w,x.t,x.y,x.e,x.d,badge(x.risk),x.c]));
if(page==='alerts')view.innerHTML=hero('Engineering risk review queue','Alerts identify combinations that require review; acknowledgement never certifies hardware.')+`<div class="alert"><div class="icon">⚠</div><div><h3>Elevated thermal input and repair interaction</h3><p>WLD-TIG-2411 combines 0.536 kJ/mm heat input with a widened HAZ and one successive repair. Review procedure limits and measured coupon evidence.</p><small>MAT-LV-2219-07 · HIGH severity</small></div>${badge('OPEN')}</div><div class="alert"><div class="icon">⚠</div><div><h3>Qualification evidence incomplete</h3><p>Prediction exists for a batch without an uploaded certificate reference. Treat output as screening only until traceability is completed.</p><small>MAT-AL-LI-03 · MEDIUM severity</small></div>${badge('OPEN')}</div>`;
if(page==='analytics')view.innerHTML=hero('Reports and analytics','Evidence coverage and model outputs summarized in an understandable engineering view.',`<button class="btn" onclick="downloadCSV()">Download CSV report</button>`)+`<div class="metrics"><div class="metric"><b>${batches.length}</b><small>Batches traced</small></div><div class="metric"><b>${welds.length}</b><small>Processes captured</small></div><div class="metric"><b>${tests.length}</b><small>Measured tests</small></div><div class="metric"><b>86–91%</b><small>Model confidence band</small></div></div><div class="panel"><h3>What the data says</h3><p class="sub">The higher-heat AA2219 weld produces the only high-risk model output. Its predicted tensile strength is 9.3% below the lower-heat record, so it is correctly routed to the review queue. Measured tests remain visibly separate from predictions.</p><div class="bars">${[421,446,912,429,389,918].map((v,i)=>`<div class="bar" style="height:${Math.max(25,v/10)}%"><span>${i<3?'TEST':'PRED'} ${i+1}</span></div>`).join('')}</div></div>`;
if(page==='sources')view.innerHTML=hero('Data provenance and limitations','Every record is classified as published reference, measured user input or model estimate.')+`<div class="source"><b>ISRO problem alignment</b><p>ISRO VSSC’s RESPOND Basket 2025 includes the research topic “Material Property Prediction Using Machine Learning & Deep Learning Models” under Structures and AI. The topic discusses TIG-welded thin-shell launch-vehicle structures and the effects of welding parameters, heat-affected-zone morphology and successive repairs on mechanical properties.</p><p>AeroForge Intelligence operationalizes that academic direction as an engineering decision-support platform. It is not an ISRO product, is not endorsed by ISRO, and contains no confidential ISRO manufacturing data.</p></div>`+table(['Evidence class','Meaning','Permitted use'],[['PUBLISHED REFERENCE','Publicly sourced nominal property','Comparison and baseline only'],['USER MEASURED','Entered from a real certificate or test report','Traceable engineering evidence'],['MODEL ESTIMATE','Calculated screening output','Prioritization and review—not certification']]);}
window.addBatch=e=>{e.preventDefault();let f=new FormData(e.target);batches.unshift(Object.fromEntries(f));localStorage.setItem('af-batches',JSON.stringify(batches));render('batches')};window.addTest=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));tests.unshift({...f,weld:'Base material',temp:'23°C'});render('tests')};window.runModel=e=>{e.preventDefault();let h=+document.querySelector('#haz').value,r=+document.querySelector('#rep').value,risk=h>3||r>0?'HIGH':'LOW';document.querySelector('#result').innerHTML=`<div class="notice" style="margin-top:18px"><b>${risk} RISK</b> · predicted tensile ${Math.round(448-h*8-r*22)} MPa · review ${risk==='HIGH'?'required':'not triggered'}</div>`};window.downloadCSV=()=>{let s='ID,Material,Weld,Tensile,Yield,Risk,Confidence\n'+preds.map(x=>[x.id,x.mat,x.w,x.t,x.y,x.risk,x.c].join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='aeroforge-report.csv';a.click()};nav.onclick=e=>{if(e.target.dataset.page){location.hash=e.target.dataset.page;render(e.target.dataset.page)}};addEventListener('hashchange',()=>render(location.hash.slice(1)||'overview'));render(location.hash.slice(1)||'overview');
</script></body></html>
